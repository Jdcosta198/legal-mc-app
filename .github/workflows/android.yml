# Compila la app de Android en cada cambio y la publica como descarga (.apk) y para Google Play (.aab).
name: App Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: native/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # El runner de GitHub ya trae el SDK de Android instalado (ANDROID_HOME).
      - name: Preparar la app web dentro del proyecto nativo
        working-directory: native
        run: npm ci && npm run sync
      - name: Llave de firma (secreto ANDROID_KEYSTORE_BASE64)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/legal-mc.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/legal-mc.jks" >> $GITHUB_ENV; else echo "::warning::Sin llave de firma: se genera un APK de prueba (debug)."; fi
      - name: Compilar
        working-directory: native/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          trap 'tail -40 build.log | sed "s/^/::error::/" ' ERR
          exec > >(tee build.log) 2>&1
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; cp app/build/outputs/apk/release/app-release.apk ../../Legal-MC.apk; cp app/build/outputs/bundle/release/app-release.aab ../../Legal-MC-GooglePlay.aab;
          else ./gradlew --no-daemon assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk ../../Legal-MC.apk; fi
      - uses: actions/upload-artifact@v4
        with: { name: legal-mc-android, path: "Legal-MC*" }
      - name: Publicar la descarga (última versión)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2.0.${{ github.run_number }}
          name: Legal M&C para Android · 2.0.${{ github.run_number }}
          body: Descargá **Legal-MC.apk** en el teléfono Android y abrilo para instalar. El archivo .aab es para Google Play.
          files: Legal-MC*
          make_latest: true
