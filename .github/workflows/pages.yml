# Publica la app web en https://jdcosta198.github.io/legal-mc-app/ en cada cambio (rama gh-pages).
# Es la dirección para instalarla en iPhone (Safari → Compartir → Agregar a pantalla de inicio).
name: Publicar web (iPhone, Android y PC)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar el sitio
        run: node scripts/build-pages.mjs
      - name: Publicar en la rama gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Sitio publicado desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
