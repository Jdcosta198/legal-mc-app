# Publica la app web en GitHub Pages (https://jdcosta198.github.io/legal-mc-app/) en cada cambio.
# Es la dirección para instalarla en iPhone (Safari → Compartir → Agregar a pantalla de inicio).
name: Publicar web (iPhone, Android y PC)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar el sitio
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
